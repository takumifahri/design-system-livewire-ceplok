; Pengaturan PHP produksi untuk image situs docs.
; Kode di dalam image tidak berubah selama container hidup, jadi OPcache tidak
; perlu memeriksa timestamp berkas. Deploy selalu membuat container baru.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
memory_limit = 256M
expose_php = Off
