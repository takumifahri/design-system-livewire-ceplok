# Deploy situs docs ke server homelab setiap ada push ke main. Push ke main di
# GitHub datang dari mirror GitLab, jadi alurnya:
#
#   GitLab → mirror GitHub → quality check → build image dan push ke GHCR
#   → runner masuk tailnet lewat Tailscale → SSH ke server → pull image → up
#
# Setelah quality check lolos, job `package` juga memecah
# packages/design-kit-livewire ke repo paket sendiri dan memberi tag versi
# sesuai CHANGELOG paket. Job itu berjalan sejajar dengan build dan deploy.
#
# Image di-build di runner, bukan di server, karena server terlalu kecil untuk
# build Vite dan Composer (CPU dua core, RAM dan /var terbatas).
name: Deploy

on:
    push:
        # `fahri` hanya untuk uji coba pipeline. Hapus sebelum merge ke staging.
        branches: [main]
    workflow_dispatch:

# Deploy dijalankan satu per satu. Push baru menunggu deploy sebelumnya selesai,
# bukan membatalkannya di tengah jalan.
concurrency:
    group: deploy-production
    cancel-in-progress: false

jobs:
    test:
        name: Quality check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  # gd dipakai UploadedFile::fake()->image() di tes Playground Upload.
                  extensions: dom, gd, intl, mbstring, pdo_sqlite
                  coverage: none

            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm

            - run: composer validate --strict --no-check-publish
            - run: composer install --no-interaction --prefer-dist --no-progress
            - run: npm ci
            # Halaman docs memakai manifest Vite, jadi build harus jalan sebelum tes.
            - run: npm run build
            - run: cp .env.example .env && php artisan key:generate
            - run: vendor/bin/pint --test
            - run: php artisan test
            # tokens:check, icons:check, dan fonts:check butuh checkout kit React di sebelahnya,
            # yang tidak ada di runner. Keduanya tetap dijalankan secara lokal.
            - run: composer audit --locked
            - run: npm audit --audit-level=high

    build:
        name: Build image
        needs: test
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        outputs:
            image: ${{ steps.image.outputs.name }}
        steps:
            - uses: actions/checkout@v4

            # Nama image GHCR harus huruf kecil, sedangkan nama owner atau repo
            # GitHub boleh berhuruf besar.
            - name: Tentukan nama image
              id: image
              run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

            - uses: docker/setup-buildx-action@v3

            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  # :latest hanya untuk build dari main, supaya build uji coba
                  # dari branch lain tidak menimpanya.
                  tags: |
                      ${{ steps.image.outputs.name }}:${{ github.sha }}
                      ${{ github.ref == 'refs/heads/main' && format('{0}:latest', steps.image.outputs.name) || '' }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    deploy:
        name: Deploy ke server
        needs: build
        runs-on: ubuntu-latest
        environment: production
        permissions:
            contents: read
            packages: read
        steps:
            # Server ada di jaringan lokal, jadi runner masuk ke tailnet dulu
            # sebagai tag:ci supaya bisa SSH ke alamat Tailscale server.
            - uses: tailscale/github-action@v3
              with:
                  oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
                  oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
                  tags: tag:ci

            - name: Tarik commit dan jalankan deploy
              env:
                  VPS_HOST: ${{ secrets.VPS_HOST }}
                  VPS_USER: ${{ secrets.VPS_USER }}
                  VPS_PATH: ${{ secrets.VPS_PATH }}
                  APP_IMAGE: ${{ needs.build.outputs.image }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              # Server memakai Tailscale SSH: izin masuknya diatur aturan `ssh`
              # di kebijakan akses Tailscale (tag:ci → tag:server sebagai user
              # deploy), jadi tidak ada kunci SSH. Identitas server sudah
              # dijamin WireGuard Tailscale, sehingga pemeriksaan host key
              # dilewati dan known_hosts tidak perlu disimpan.
              #
              # Nilai dikirim lewat isi skrip (stdin), bukan argumen ssh, supaya
              # token tidak terlihat di daftar proses server. Kode ditarik dulu
              # sebelum deploy.sh dijalankan, supaya yang dieksekusi adalah versi
              # skrip dan compose.yaml dari commit baru.
              #
              # GITHUB_TOKEN dipakai server untuk dua hal: membaca repo privat
              # saat git fetch dan menarik image dari GHCR. Token itu hanya
              # berlaku selama job ini. Untuk git, token dikirim sebagai header
              # lewat env GIT_CONFIG_*, jadi tidak tersimpan di .git/config dan
              # tidak muncul di argumen proses. Untuk Docker, server logout lagi
              # setelah pull.
              run: |
                  {
                      printf 'export VPS_PATH=%q APP_IMAGE=%q APP_TAG=%q APP_BRANCH=%q APP_REPO=%q GH_USER=%q GH_TOKEN=%q\n' \
                          "$VPS_PATH" "$APP_IMAGE" "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" "$GITHUB_ACTOR" "$GH_TOKEN"
                      cat <<'EOF'
                  set -euo pipefail
                  cd "$VPS_PATH"
                  GIT_CONFIG_COUNT=1 \
                  GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
                  GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
                      git fetch --prune "https://github.com/$APP_REPO.git" "$APP_BRANCH"
                  git reset --hard "$APP_TAG"
                  printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_USER" --password-stdin
                  trap 'docker logout ghcr.io >/dev/null' EXIT
                  bash scripts/deploy.sh
                  EOF
                  } | ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                      "$VPS_USER@$VPS_HOST" bash -s

    package:
        name: Publikasi paket
        needs: test
        # Repo paket hanya menerima kode dari main, termasuk saat workflow
        # dijalankan manual dari branch lain.
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            contents: read
        env:
            PACKAGE_PREFIX: packages/design-kit-livewire
            PACKAGE_REPO: ${{ vars.PACKAGE_REPO }}
            PACKAGE_TOKEN: ${{ secrets.PACKAGE_REPO_TOKEN }}
        steps:
            # subtree split membaca seluruh riwayat folder paket, jadi checkout
            # tidak boleh dangkal.
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - run: composer validate --strict --no-check-publish
              working-directory: ${{ env.PACKAGE_PREFIX }}

            # Hasil split deterministik: commit yang sama di repo utama selalu
            # menghasilkan SHA yang sama, jadi push ke repo paket selalu
            # fast-forward. Push tidak memakai --force, supaya riwayat paket
            # yang sudah dipakai consumer tidak pernah ditulis ulang.
            - name: Split folder paket
              run: git subtree split --prefix="$PACKAGE_PREFIX" -b package-split

            # Token dikirim sebagai header lewat env GIT_CONFIG_*, sama seperti
            # job deploy, supaya tidak tersimpan di .git/config dan tidak
            # muncul di argumen proses.
            - name: Push ke repo paket
              run: |
                  export GIT_CONFIG_COUNT=1
                  export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
                  export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PACKAGE_TOKEN" | base64 -w0)"
                  git push "https://github.com/$PACKAGE_REPO.git" package-split:refs/heads/main

            # Versi diputuskan lewat CHANGELOG, bukan oleh CI. Tag vX.Y.Z dibuat
            # hanya bila bagian `## [X.Y.Z]` teratas di CHANGELOG belum punya
            # tag di repo paket. Bagian [Unreleased] tidak pernah di-tag, jadi
            # merge yang tidak merilis apa pun tidak menghasilkan versi baru.
            #
            # Tag dipasang di HEAD hasil split, karena bagian versi baru masuk
            # bersama merge yang merilisnya. Versi lama yang belum punya tag
            # dilewati: commit-nya tidak bisa ditebak dengan pasti.
            - name: Tag versi dari CHANGELOG
              run: |
                  export GIT_CONFIG_COUNT=1
                  export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
                  export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PACKAGE_TOKEN" | base64 -w0)"

                  version=$(grep -m1 -oP '^## \[\K[0-9]+\.[0-9]+\.[0-9]+(?=\])' "$PACKAGE_PREFIX/CHANGELOG.md" || true)
                  if [ -z "$version" ]; then
                      echo "CHANGELOG belum punya bagian versi rilis. Tag dilewati."
                      exit 0
                  fi

                  tag="v$version"
                  if git ls-remote --exit-code --tags "https://github.com/$PACKAGE_REPO.git" "refs/tags/$tag" >/dev/null; then
                      echo "$tag sudah ada di repo paket. Tag dilewati."
                      exit 0
                  fi

                  # -f karena checkout penuh ikut membawa tag repo utama dengan
                  # nama yang mungkin sama tapi menunjuk commit repo utama.
                  git -c user.name='github-actions[bot]' \
                      -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                      tag -f -a "$tag" package-split -m "$tag"
                  git push "https://github.com/$PACKAGE_REPO.git" "refs/tags/$tag"
                  echo "::notice::$tag dibuat di $PACKAGE_REPO"
